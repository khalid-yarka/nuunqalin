<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pdf_admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="pdf-admin-wrapper">
        <div class="pdf-admin-login">
            <div class="pdf-admin-login-card">
                <div class="login-header">
                    <i class="fas fa-file-pdf login-icon"></i>
                    <h1>PDF Management</h1>
                    <p>Sign in to access the PDF administration panel</p>
                </div>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="pdf-alert pdf-alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST" action="{{ url_for('pdf_admin.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="pdf-form-group">
                        <label for="username">Username</label>
                        <div class="pdf-input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                        </div>
                    </div>
                    <div class="pdf-form-group">
                        <label for="password">Password</label>
                        <div class="pdf-input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                            <span class="toggle-password" onclick="togglePassword()"><i class="fas fa-eye"></i></span>
                        </div>
                    </div>
                    <button type="submit" class="pdf-btn pdf-btn-primary pdf-btn-block">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>
                <div class="login-footer">
                    <span>Secure admin access</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
